<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绑定手机号 · 尾货街</title>
<meta name="description" content="绑定手机号后可收藏、关注、留言咨询；实名认证后可查看联系方式与发布货源。">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="/assets/style.css">
<link rel="canonical" href="https://weihuo.zangxixitech.cn/login">
<meta name="theme-color" content="#E64A2E">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://weihuo.zangxixitech.cn/#org","name":"尾货街","url":"https://weihuo.zangxixitech.cn/","description":"尾货货源信息对接平台，汇集服装尾货、库存批发、工厂尾单货源。"}]}</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="back" href="javascript:history.back()" aria-label="返回" style="font-size:20px;line-height:1;padding:0 4px">‹</a>
    <div class="brand-name" style="flex:1 1 auto">绑定手机号</div>
    <a href="/" style="font-size:12.5px;color:var(--t2)">首页</a>
  </div>
</header>


<section class="panel" style="margin-top:8px">
  <h3>绑手机能做什么</h3>
  <ul>
    <li>收藏货源、关注档口、给商家留言咨询；</li>
    <li>接收被回复通知（短信 + 站内红点）；</li>
    <li>这是发布信息与实名认证的<b>前置步骤</b>。</li>
  </ul>
  <p style="margin-top:8px">只看不联系的话，<b>不绑手机也能浏览全站</b>。</p>
</section>

<section class="form" style="margin-top:8px">
  <div class="fld"><label for="l-phone">手机号</label><div class="in">
    <input id="l-phone" type="tel" inputmode="numeric" placeholder="11 位手机号" maxlength="11">
  </div></div>
  <div class="fld"><label for="l-code">验证码</label><div class="in" style="display:flex;gap:8px">
    <input id="l-code" type="text" inputmode="numeric" placeholder="6 位验证码" maxlength="6" style="flex:1 1 auto">
    <button class="btn-sm line" type="button" id="btnCode" style="flex:0 0 auto;padding:0 16px">获取验证码</button>
  </div></div>
</section>

<div class="form-actions">
  <button class="btn-primary" type="button" id="btnLogin">绑定并登录</button>
  <div class="hint" style="text-align:center;margin-top:12px;color:var(--t3);font-size:12px;line-height:1.7">
    绑定即表示同意 <a href="/terms" style="color:var(--primary)">用户协议</a> 与 <a href="/privacy" style="color:var(--primary)">隐私政策</a>。
  </div>
</div>

<footer class="foot">
  <div><b class="hl">尾货街</b> · 尾货货源信息平台</div>
  <div>
    <a href="/about">关于我们</a>
    <a href="/terms">用户协议</a>
    <a href="/privacy">隐私政策</a>
    <a href="/disclaimer">免责声明</a>
    <a href="/report-guide">举报指引</a>
  </div>
  <div style="margin-top:6px;font-size:11px">平台仅提供信息对接，不参与交易、不担保货物质量、不代收货款</div>
  <div style="margin-top:4px;font-size:11px">客服微信 SXLH-888</div>
</footer>

<nav class="tabbar">
  <a href="/"><span class="ti">⌂</span>首页</a>
  <a href="/caigou"><span class="ti">⌕</span>采购商</a>
  <a href="/publish" class="plus" aria-label="发布货源"><span class="ti">＋</span></a>
  <a href="/msg"><span class="ti">✉</span>消息</a>
  <a href="/me" class="on"><span class="ti">☺</span>我的</a>
</nav>

<script>
(function(){
  'use strict';
  function t(msg){var e=document.getElementById('__t')||null;if(!e){e=document.createElement('div');e.id='__t';e.className='toast';document.body.appendChild(e);}e.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2400);}
  function tipExtra(){return '，或加客服微信 SXLH-888 直接提交';}
  // 发布类型切换
  var seg=document.getElementById('segType');
  if(seg){Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){x.classList.remove('on');});b.classList.add('on');});});}
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-act]'):null;
    if(!el)return;e.preventDefault();
    t('「'+(el.getAttribute('data-act'))+'」正在接入后端，暂时请加客服微信 SXLH-888 提交');
  });
  var map={'btnSubmit':'提交审核','btnPhoto':'上传货源图','btnJoin':'提交入驻申请','btnVerify':'提交实名认证','btnLogin':'绑定并登录','btnCode':'获取验证码'};
  Object.keys(map).forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener('click',function(){t('「'+map[id]+'」功能正在接入，暂时请加客服微信 SXLH-888 提交');});
  });
})();
</script>

<script src="/assets/app.js"></script>
</body>
</html>
