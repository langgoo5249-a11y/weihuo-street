<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="back" href="javascript:history.back()" aria-label="返回" style="font-size:20px;line-height:1;padding:0 4px">‹</a>
    <div class="brand-name" style="flex:1 1 auto">商家入驻</div>
    <a href="/" style="font-size:12.5px;color:var(--t2)">首页</a>
  </div>
</header>


<section class="panel" style="margin-top:8px">
  <h3>入驻能拿到什么</h3>
  <ul>
    <li>免费发布货源，<b>不限条数</b>；</li>
    <li>实名认证后，买家可查看你的<b>电话 / 微信</b>；</li>
    <li>获得独立的<b>店铺页</b>，买家可以一次看全你在售的货；</li>
    <li>同城采购商搜品类、搜市场时能被搜到。</li>
  </ul>
</section>

<section class="form" style="margin-top:8px">
  <div class="fld"><label for="j-name">档口 / 工厂名</label><div class="in">
    <input id="j-name" type="text" placeholder="例：四季青 · 女装档口">
  </div></div>
  <div class="fld"><label for="j-market">所在市场</label><div class="in">
    <input id="j-market" type="text" placeholder="例：杭州四季青服装市场 A 区">
  </div></div>
  <div class="fld"><label for="j-city">城市</label><div class="in">
    <select id="j-city"><option>杭州</option><option>广州</option><option>义乌</option><option>常熟</option><option>虎门</option><option>南通</option><option>佛山</option><option>其他</option></select>
  </div></div>
  <div class="fld"><label for="j-cat">主营品类</label><div class="in">
    <input id="j-cat" type="text" placeholder="例：女装 · 雪纺衫 / 针织">
  </div></div>
  <div class="fld"><label for="j-phone">手机号</label><div class="in">
    <input id="j-phone" type="tel" inputmode="numeric" placeholder="必填，仅向实名采购商展示">
  </div></div>
  <div class="fld"><label for="j-wx">微信号</label><div class="in">
    <input id="j-wx" type="text" placeholder="必填，仅向实名采购商展示">
    <div class="hint">电话和微信<b>必须填</b>——买家找不到你，入驻就没意义。</div>
  </div></div>
  <div class="fld"><label>身份认证</label><div class="in">
    <a class="btn-ghost" href="/verify" style="font-size:13.5px;padding:10px 0">去完成实名认证 ›</a>
    <div class="hint">入驻必须实名。实名信息不外显，仅用于追责与防骗。</div>
  </div></div>
</section>

<div class="form-actions">
  <button class="btn-primary" type="button" id="btnJoin">提交入驻申请</button>
</div>

<footer class="foot">
  <div><b class="hl">尾货街</b> · 尾货货源信息平台</div>
  <div>
    <a href="/about">关于我们</a>
    <a href="/terms">用户协议</a>

    <a href="/disclaimer">免责声明</a>

  <div style="margin-top:4px;font-size:11px">客服微信 SXLH-888</div>
</footer>

  <a href="/"><span class="ti">⌂</span>首页</a>

</nav>

<script>
(function(){
  'use strict';
  function t(msg){var e=document.getElementById('__t')||null;if(!e){e=document.createElement('div');e.id='__t';e.className='toast';document.body.appendChild(e);}e.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2400);}
  function tipExtra(){return '，或加客服微信 SXLH-888 直接提交';}
  // 发布类型切换
  var seg=document.getElementById('segType');
  if(seg){Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){x.classList.remove('on');});b.classList.add('on');});});}
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-act]'):null;
    if(!el)return;e.preventDefault();
    t('「'+(el.getAttribute('data-act'))+'」正在接入后端，暂时请加客服微信 SXLH-888 提交');
  });
  var map={'btnSubmit':'提交审核','btnPhoto':'上传货源图','btnJoin':'提交入驻申请','btnVerify':'提交实名认证','btnLogin':'绑定并登录','btnCode':'获取验证码'};
  Object.keys(map).forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener('click',function(){t('「'+map[id]+'」功能正在接入，暂时请加客服微信 SXLH-888 提交');});
  });
})();
</script>
